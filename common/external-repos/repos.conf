# common/external-repos/repos.conf
#
# Lists external git repos (mostly private or org-internal-visibility
# GitHub repos) that hold company- or personal-specific tooling not
# appropriate for this public repo -- see AGENTS.md's "Public repository
# boundaries" section, and its "External repo linking model" section for
# the full design and how to add a new entry.
#
# script/external-repos-sync clones/updates each entry opportunistically;
# a machine without access to a given repo silently skips just that line.
# Repo slugs and short names here are not secrets -- this repo already
# names an external repo (rneatherway/gh-slack) in common/agents/install.sh
# today -- only the *contents* of a private repo are sensitive, and those
# never live in this repo.
#
# Columns are whitespace-separated (no spaces within a field), comments
# start with '#', blank lines are ignored:
#
#   name   short id -- used as the local clone directory name. Must be
#          filesystem-safe (no slashes).
#   repo   GitHub "owner/repo" slug. Works for public, private, and
#          org-internal-visibility repos as long as `gh auth status` has
#          access on this machine; otherwise the entry is skipped
#          silently.
#   kind   what to do once cloned. Currently supported:
#            gh-extension  register it as a gh CLI extension
#                          (gh extension install . --force) after every
#                          successful clone/update. Nothing else needs
#                          wiring up in this repo.
#
# name              repo                          kind
gh-toil            Jcambass/gh-toil              gh-extension
